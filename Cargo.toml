[package]
name = "git-system-tray"
version = "1.4.2"
edition = "2024"

[[bin]]
name = "git-system-tray"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
open = "5.3.2"
dirs = "6.0.0"
# Copies the device code to the clipboard when a Device Flow dialog appears, so entering it on
# GitHub's page is a paste instead of a manual retype. Cross-platform itself (Windows/macOS/X11/
# Wayland), so unlike the tray/GTK split above this is a single, unconditional dependency.
arboard = "3.4"
# Shared, not Windows-only: Linux needs it to *encode* the composited review-dot icons, because
# libappindicator takes a filesystem path rather than pixel data.
image = { version = "0.24", default-features = false, features = ["png"] }
# The self-updater's integrity chain. Both are small, pure-Rust and do no I/O of their own.
#
# `minisign-verify` is verify-only by design: it cannot sign, so no private-key handling can ever
# creep into the shipped binary. It is what makes the update chain an *authenticity* check rather
# than just a corruption check — see `update::verify_checksums`. A signature checked against a key
# already compiled into the installed binary is the only link an attacker who can replace release
# assets, or intercept TLS with a trusted root, cannot forge.
minisign-verify = "0.2"
# SHA-256 for the per-asset digests listed in the signed sums file.
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
# glib is deliberately NOT a direct dependency: `gtk` re-exports the exact glib it was built
# against (`gtk::glib`). Declaring a separate version linked two Rust glib crates against the
# same libglib-2.0, so the GTK main loop and our timer came from different bindings.
libappindicator = "0.9.0"

# Windows and macOS share one tray implementation: both drive `tray-icon` from a `winit` event
# loop. Only the *timing* of the tray's creation differs (see `main.rs`), not the crates.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.21.1"
winit = "0.30.12"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.9", features = ["winuser", "synchapi", "errhandlingapi", "processthreadsapi", "handleapi", "winnt"] }
