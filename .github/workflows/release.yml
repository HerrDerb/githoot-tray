name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── 1. Create release with commit changelog ──────────────────────────────────
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create or update release with changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_TAG="${{ github.ref_name }}"

          # Pick the previous tag by ancestry, not by version order. Sorting all tags and taking
          # the highest that isn't this one silently produces a BACKWARDS range whenever the tag
          # being released is not the newest (e.g. releasing v1.0.2 while v1.0.3 exists computed
          # "v1.0.3..v1.0.2", i.e. nothing). `--merged` restricts to tags reachable from this
          # tag; the inner filter drops tags pointing at the same commit, so double-tagged
          # commits give a consistent answer either way round.
          #
          # `|| true` matters: on the very first release the filters yield nothing and exit 1,
          # and `head -1` can SIGPIPE `git tag`. Either would kill the step under `pipefail`.
          CURRENT_SHA=$(git rev-list -n1 "$CURRENT_TAG")
          PREV_TAG=$(git tag --merged "$CURRENT_TAG" --sort=-version:refname \
            | grep -v "^${CURRENT_TAG}$" \
            | while read -r t; do
                if [ "$(git rev-list -n1 "$t")" != "$CURRENT_SHA" ]; then echo "$t"; fi
              done \
            | head -1 || true)

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
            HEADING="## Changes since ${PREV_TAG}"
          else
            RANGE="$CURRENT_TAG"
            HEADING="## All commits"
          fi

          # Re-tagging an already-released commit yields an empty range, which would otherwise
          # produce a release body containing nothing but a heading.
          CHANGELOG=$(git log ${RANGE} --oneline --no-merges)
          printf '%s\n\n%s\n' "$HEADING" "${CHANGELOG:-_No new commits in this range._}" > notes.md

          # The release may already exist. Creating one through the GitHub UI or with
          # `gh release create` also creates the tag, and that tag push is what triggers this
          # workflow — so the job can be triggered by the very release it is trying to create.
          if gh release view "$CURRENT_TAG" >/dev/null 2>&1; then
            EXISTING=$(gh release view "$CURRENT_TAG" --json body --jq '.body // ""' | tr -d '[:space:]')
            if [ -z "$EXISTING" ]; then
              echo "Release $CURRENT_TAG exists with empty notes — filling in the changelog."
              gh release edit "$CURRENT_TAG" --notes-file notes.md
            else
              # Never clobber notes a human wrote by hand.
              echo "Release $CURRENT_TAG already has notes — leaving them untouched."
            fi
          else
            gh release create "$CURRENT_TAG" \
              --title "$CURRENT_TAG" \
              --notes-file notes.md
          fi

  # ── 2. Build release binaries for Windows and Linux ─────────────────────────
  build:
    needs: release-notes
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: git-system-tray.exe

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: git-system-tray

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libappindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        # The tag is baked into the binary, not read from Cargo.toml. This workflow has always treated
        # the tag as the source of truth (see build-macos below), and the self-updater compares against
        # whatever the binary reports — so if it reported Cargo.toml's version, a forgotten bump would
        # make it either miss real updates or claim ones that do not exist.
        env:
          GST_VERSION: ${{ github.ref_name }}
        run: |
          export GST_VERSION="${GST_VERSION#v}"
          cargo build --release --target ${{ matrix.target }}
        shell: bash

      - name: Attach binary to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" \
            "target/${{ matrix.target }}/release/${{ matrix.artifact }}" \
            --clobber

  # ── 3. Build the macOS .app bundle ──────────────────────────────────────────
  # A separate job rather than a third matrix entry: this one needs bundling, signing and zipping
  # steps the other two have no use for, and the alternative is making every step in `build`
  # conditional on the runner OS. The cost is a few duplicated setup lines; the benefit is that the
  # working Windows and Linux path is left exactly as it was.
  build-macos:
    needs: release-notes
    if: always()
    # Pinned rather than `macos-latest` so the runner architecture cannot change under us: the
    # artefact name promises aarch64.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        env:
          GST_VERSION: ${{ github.ref_name }}
        run: |
          export GST_VERSION="${GST_VERSION#v}"
          cargo build --release --target aarch64-apple-darwin

      - name: Bundle, sign and zip
        run: |
          set -euo pipefail
          # The tag is the source of truth for the version here, as it is for the release notes.
          # Cargo.toml's version is never consulted by this workflow.
          bash scripts/bundle-macos.sh \
            target/aarch64-apple-darwin/release/git-system-tray \
            dist \
            "${GITHUB_REF_NAME#v}"

      - name: Attach bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/git-system-tray-macos-aarch64.zip \
            --clobber

  # ── 4. Sign the release assets ──────────────────────────────────────────────
  # This is what makes the self-updater safe, and it is the only part of the chain that provides
  # *authenticity* rather than just integrity.
  #
  # The updater fetches sha256sums.txt plus its detached signature, and verifies that signature against
  # a public key compiled into the already-installed binary. A digest file on its own would be worthless
  # here: it travels the same channel from the same host as the asset, so anyone able to replace one can
  # replace the other. Only a key that was already on the user's machine breaks that circularity.
  #
  # Runs last, and needs every build job, because it hashes what they uploaded. `if: always()` is
  # deliberately NOT used: signing a partial set would publish a manifest missing a platform, and the
  # updater would then refuse that platform's asset with a confusing "no entry in the signed sums file"
  # rather than the truth, which is that its build failed.
  sign:
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern 'git-system-tray' \
            --pattern 'git-system-tray.exe' \
            --pattern 'git-system-tray-macos-aarch64.zip'
          ls -l

      - name: Hash them
        run: |
          set -euo pipefail
          cd dist
          # Plain `sha256sum` format: "<hex>  <name>". The updater matches on the file name only, so
          # running this from inside dist/ keeps the paths bare.
          sha256sum git-system-tray git-system-tray.exe git-system-tray-macos-aarch64.zip \
            > sha256sums.txt
          cat sha256sums.txt

      - uses: dtolnay/rust-toolchain@stable

      - name: Install the signing tool
        # `rsign2` rather than apt's `minisign`, deliberately: it is what generated the key, so there is
        # no cross-tool compatibility question about a passwordless secret key, and its prehashed output
        # is what `minisign-verify` in the app is tested against (see `update::tests`).
        run: cargo install rsign2 --locked

      - name: Sign the digest file
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set, so this release cannot be signed and the" \
                 "self-updater would refuse it. See README, Maintainer setup: signing keys."
            exit 1
          fi
          # Written outside the workspace and removed straight after, so it cannot be picked up by a
          # later step or an artifact upload.
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$keyfile"
          # `-W` on *signing* too, not just generation: without it rsign tries to prompt for a password
          # and fails on a runner with no tty.
          rsign sign -W -s "$keyfile" -x dist/sha256sums.txt.minisig dist/sha256sums.txt
          test -s dist/sha256sums.txt.minisig

      - name: Verify what was just signed
        # Cheap, and it is the difference between publishing a signature and publishing a signature that
        # works. A release whose signature does not verify would be refused by every client.
        run: |
          set -euo pipefail
          rsign verify -P 'RWSYrhd3sxiQUDZtxm8c+p0iRdj+z+fGQKdLq62ojrmfii2OjCG8PX8D' \
            -x dist/sha256sums.txt.minisig dist/sha256sums.txt

      - name: Attach the manifest and signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `--repo` is required: this job deliberately does not check the repository out (it only needs
          # the published assets), so `gh` has no git remote to infer the repo from. The download step
          # above passes it for the same reason; omitting it here is what broke the v1.3.0 run.
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            dist/sha256sums.txt \
            dist/sha256sums.txt.minisig \
            --clobber
