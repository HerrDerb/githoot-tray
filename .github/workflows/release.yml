name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── 1. Create release with commit changelog ──────────────────────────────────
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create or update release with changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_TAG="${{ github.ref_name }}"

          # Pick the previous tag by ancestry, not by version order. Sorting all tags and taking
          # the highest that isn't this one silently produces a BACKWARDS range whenever the tag
          # being released is not the newest (e.g. releasing v1.0.2 while v1.0.3 exists computed
          # "v1.0.3..v1.0.2", i.e. nothing). `--merged` restricts to tags reachable from this
          # tag; the inner filter drops tags pointing at the same commit, so double-tagged
          # commits give a consistent answer either way round.
          #
          # `|| true` matters: on the very first release the filters yield nothing and exit 1,
          # and `head -1` can SIGPIPE `git tag`. Either would kill the step under `pipefail`.
          CURRENT_SHA=$(git rev-list -n1 "$CURRENT_TAG")
          PREV_TAG=$(git tag --merged "$CURRENT_TAG" --sort=-version:refname \
            | grep -v "^${CURRENT_TAG}$" \
            | while read -r t; do
                if [ "$(git rev-list -n1 "$t")" != "$CURRENT_SHA" ]; then echo "$t"; fi
              done \
            | head -1 || true)

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
            HEADING="## Changes since ${PREV_TAG}"
          else
            RANGE="$CURRENT_TAG"
            HEADING="## All commits"
          fi

          # Re-tagging an already-released commit yields an empty range, which would otherwise
          # produce a release body containing nothing but a heading.
          CHANGELOG=$(git log ${RANGE} --oneline --no-merges)
          printf '%s\n\n%s\n' "$HEADING" "${CHANGELOG:-_No new commits in this range._}" > notes.md

          # The release may already exist. Creating one through the GitHub UI or with
          # `gh release create` also creates the tag, and that tag push is what triggers this
          # workflow — so the job can be triggered by the very release it is trying to create.
          if gh release view "$CURRENT_TAG" >/dev/null 2>&1; then
            EXISTING=$(gh release view "$CURRENT_TAG" --json body --jq '.body // ""' | tr -d '[:space:]')
            if [ -z "$EXISTING" ]; then
              echo "Release $CURRENT_TAG exists with empty notes — filling in the changelog."
              gh release edit "$CURRENT_TAG" --notes-file notes.md
            else
              # Never clobber notes a human wrote by hand.
              echo "Release $CURRENT_TAG already has notes — leaving them untouched."
            fi
          else
            gh release create "$CURRENT_TAG" \
              --title "$CURRENT_TAG" \
              --notes-file notes.md
          fi

  # ── 2. Build release binaries for Windows and Linux ─────────────────────────
  build:
    needs: release-notes
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: git-system-tray.exe

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: git-system-tray

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libappindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Attach binary to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" \
            "target/${{ matrix.target }}/release/${{ matrix.artifact }}" \
            --clobber

  # ── 3. Build the macOS .app bundle ──────────────────────────────────────────
  # A separate job rather than a third matrix entry: this one needs bundling, signing and zipping
  # steps the other two have no use for, and the alternative is making every step in `build`
  # conditional on the runner OS. The cost is a few duplicated setup lines; the benefit is that the
  # working Windows and Linux path is left exactly as it was.
  build-macos:
    needs: release-notes
    if: always()
    # Pinned rather than `macos-latest` so the runner architecture cannot change under us: the
    # artefact name promises aarch64.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Bundle, sign and zip
        run: |
          set -euo pipefail
          # The tag is the source of truth for the version here, as it is for the release notes.
          # Cargo.toml's version is never consulted by this workflow.
          bash scripts/bundle-macos.sh \
            target/aarch64-apple-darwin/release/git-system-tray \
            dist \
            "${GITHUB_REF_NAME#v}"

      - name: Attach bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/git-system-tray-macos-aarch64.zip \
            --clobber
